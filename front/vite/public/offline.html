<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <title>Sem conexão · Pub Mail</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(1200px 600px at 20% -10%, #1b3a78 0%, transparent 60%), #0b1120;
      color: #e2e8f0; font-family: Ubuntu, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
    }
    main { max-width: 360px; }
    img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 40px rgba(55, 126, 240, .35); }
    h1 { font-size: 22px; margin: 22px 0 8px; color: #fff; }
    p { margin: 0 0 24px; color: #94a3b8; line-height: 1.5; font-size: 15px; }
    button {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 700;
      color: #fff; background: #377EF0; cursor: pointer; box-shadow: 0 6px 20px rgba(55, 126, 240, .35);
    }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="Pub Mail" />
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, o Pub Mail abre de novo. Suas conversas e dados continuam salvos.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
